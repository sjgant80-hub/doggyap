name: gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: tests
        run: node doggyap.test.mjs

      # The mutation gate. Pinned to @v0.2 deliberately — the baselines in this repo postdate v0.1
      # and a floating tag would let the gate drift out from under the thing it is gating.
      - name: witness · mutation + fuzz
        uses: sjgant80-hub/witness@v0.2
        with:
          source: doggyap.mjs
          test: node doggyap.test.mjs
          cap: '400'
